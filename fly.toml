# fly.toml app configuration file generated for projectmotor on 2024-12-25T13:28:55+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'projectmotor'
primary_region = 'otp'

[build]
  [build.args]
    GO_VERSION = '1.23.4'

[deploy]
  release_command = '/app/release.sh'

[env]
  PORT = '8080'
  HOST = '0.0.0.0'
  STATIC_DIR = '/app/static'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
